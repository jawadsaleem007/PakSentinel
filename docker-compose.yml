version: '3.8'

services:
  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: paksentinel-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MLFlow Tracking Server
  mlflow:
    image: python:3.11-slim
    container_name: paksentinel-mlflow
    ports:
      - "5000:5000"
    working_dir: /app
    volumes:
      - ./mlruns:/app/mlruns
      - mlflow_artifacts:/app/artifacts
    command: >
      bash -c "pip install mlflow && 
               mlflow server --host 0.0.0.0 --port 5000 
               --backend-store-uri file:///app/mlruns 
               --default-artifact-root /app/artifacts"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PakSentinel FastAPI Application
  paksentinel-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paksentinel-api
    ports:
      - "8000:8000"
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns
      - ./logs:/app/logs
    depends_on:
      minio:
        condition: service_healthy
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000

volumes:
  minio_data:
  mlflow_artifacts:
